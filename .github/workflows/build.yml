name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FreeTunes.zip
      - run: sed -i "s/YOUR_CLIENT_ID/${{ secrets.JAMENDO_CLIENT_ID }}/" FreeTunes/app/src/main/java/com/freetunes/Jamendo.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: FreeTunes
      - uses: actions/upload-artifact@v4
        with:
          name: FreeTunes-apk
          path: FreeTunes/app/build/outputs/apk/debug/app-debug.apk
